<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 270" role="img" aria-labelledby="title desc">
  <title id="title">Atlas: effect distributions</title><desc id="desc">Illustrative effect estimates with uncertainty across three analysis groups.</desc>
  <rect width="390" height="270" fill="#f5f6f3"/><path d="M0 42H390M0 234H390" stroke="#cfd4d8"/>
  <text x="18" y="26" fill="#26313e" font-family="monospace" font-size="11" letter-spacing=".8">ATLAS / EFFECTS</text>
  <text x="372" y="26" text-anchor="end" fill="#77818b" font-family="monospace" font-size="10">ILLUSTRATIVE</text>
  <text x="18" y="69" fill="#202b37" font-family="sans-serif" font-size="16" font-weight="600">How stable is the effect?</text>
  <g stroke="#dde1e3"><path d="M145 91V205M197 91V205M249 91V205M301 91V205M353 91V205"/></g>
  <path d="M249 91V205" stroke="#9ba5ae" stroke-dasharray="4 4"/>
  <g fill="#47535f" font-family="sans-serif" font-size="11"><text x="18" y="119">Full sample</text><text x="18" y="158">High baseline</text><text x="18" y="197">Low baseline</text></g>
  <g stroke="#527bb7" stroke-width="2" fill="none"><path d="M229 115H350M229 108V122M350 108V122"/><path d="M199 154H325M199 147V161M325 147V161"/></g>
  <g fill="#9bb3d2" stroke="#527bb7"><rect x="263" y="105" width="51" height="20"/><rect x="229" y="144" width="56" height="20"/></g>
  <g stroke="#315f9e" stroke-width="2"><path d="M288 105V125M257 144V164"/></g>
  <path d="M170 193H294M170 186V200M294 186V200" fill="none" stroke="#828e9a" stroke-width="2"/>
  <rect x="204" y="183" width="52" height="20" fill="#cfd6dc" stroke="#8d99a4"/>
  <path d="M231 183V203" stroke="#566675" stroke-width="2"/>
  <g fill="#687583" font-family="monospace" font-size="10"><text x="145" y="222" text-anchor="middle">−.4</text><text x="249" y="222" text-anchor="middle">0</text><text x="353" y="222" text-anchor="middle">+.4</text></g>
  <text x="18" y="255" fill="#667480" font-family="sans-serif" font-size="11">Box = interquartile range · line = uncertainty</text>
</svg>
